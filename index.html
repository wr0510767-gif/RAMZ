<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMZ AI - Tu inteligencia. Tu negocio. Tu futuro.</title>

        :root {
            --bg-black: #0a0a0c;
            --bg-dark-blue: #0f172a;
            --electric-blue: #2563eb;
            --electric-cyan: #38bdf8;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, var(--bg-black) 0%, var(--bg-dark-blue) 100%);
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: 20px;
        }

        .logo-container {
            text-align: center;
        }

        .crown {
            font-size: 28px;
            color: #f59e0b;
            margin-bottom: -10px;
            display: block;
        }

        .logo {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, var(--electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero {
            text-align: center;
            max-width: 400px;
            margin: 40px 0;
        }

        .tagline {
            font-size: 18px;
            color: var(--text-gray);
            margin-top: 10px;
            font-weight: 400;
        }

        .slogan {
            font-size: 22px;
            font-weight: 700;
            color: var(--electric-cyan);
            margin-top: 15px;
        }

        .actions {
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--electric-blue), var(--electric-cyan));
            color: var(--text-white);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-white);
            border: 2px solid var(--electric-blue);
        }
